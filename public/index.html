<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Altunium</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 20px auto; padding: 0 12px; }
    #messages { border: 1px solid #ccc; height: 400px; overflow-y: auto; padding: 10px; border-radius: 8px; }
    #messages div { margin: 4px 0; }
    #form { display: flex; margin-top: 10px; gap: 8px; }
    #input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 6px; }
    button { padding: 10px 18px; border: none; background: #5865f2; color: #fff; border-radius: 6px; cursor: pointer; }
    button:hover { background: #4752c4; }
    #channels { display: flex; gap: 8px; margin-bottom: 12px; }
    .channel {
      background: #2b2d31; color: #ddd;
      padding: 8px 14px; border-radius: 6px;
      border: none; cursor: pointer; font-size: 14px;
    }
    .channel:hover { background: #3a3d43; }
    .channel.active { background: #5865f2; color: #fff; }
  </style>
</head>
<body>
  <h1>Altunium</h1>
  <div id="channels">
    <button class="channel active" data-channel="general"># общий</button>
    <button class="channel" data-channel="games"># игры</button>
    <button class="channel" data-channel="memes"># мемы</button>
  </div>
  <div id="messages"></div>
  <form id="form">
    <input id="input" autocomplete="off" placeholder="Напиши сообщение..." />
    <button>Отправить</button>
  </form>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const name = prompt('Как тебя зовут?') || 'Аноним';
    let currentChannel = 'general';
    socket.emit('join', currentChannel);

    document.querySelectorAll('.channel').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.channel').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        currentChannel = btn.dataset.channel;
        socket.emit('join', currentChannel);
        
      });
    });
    const messages = document.getElementById('messages');
    const form = document.getElementById('form');
    const input = document.getElementById('input');

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      if (input.value.trim()) {
        socket.emit('message', { name, text: input.value, channel: currentChannel });
        input.value = '';
      }
    });

    socket.on('message', (msg) => {
      const div = document.createElement('div');
      div.textContent = `${msg.name}: ${msg.text}`;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    });
    socket.on('history', (history) => {
      messages.innerHTML = '';
      history.forEach(msg => {
        const div = document.createElement('div');
        div.textContent = `${msg.name}: ${msg.text}`;
        messages.appendChild(div);
      });
      messages.scrollTop = messages.scrollHeight;
    });
  </script>
</body>
</html>
